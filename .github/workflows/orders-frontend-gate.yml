name: Orders frontend production gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/modules/orders/**"
      - "src/shared/trip/**"
      - "src/modules/operations/vehicle-trips/**"
      - "src/modules/masters/**"
      - "src/modules/auth/**"
      - "package.json"
      - "tsconfig*.json"
      - "eslint.config.*"
      - ".github/workflows/orders-frontend-gate.yml"

jobs:
  orders-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Orders navigation and business-rule tests
        run: npm run test:orders-navigation

      - name: Orders performance/index tests
        run: npm run test:orders-performance

      - name: Orders service contract tests
        run: npm run test:orders-contract

      - name: Orders real UI E2E against isolated backend harness
        run: npx playwright test tests/e2e/trip-workflow.e2e.spec.ts --project=trip-workflow

      - name: Production build
        run: npm run build

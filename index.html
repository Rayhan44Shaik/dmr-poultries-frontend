<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="DMR Poultries — poultry logistics, operations, accounts, fleet and staff management."
    />
    <title>DMR Poultries</title>
    <style>
      html, body { background: #f8fafc; }
      #root { background: #f8fafc; min-height: 100vh; }
    </style>
    <!-- Inter is bundled locally via @fontsource/inter (src/index.css) — no
         external font request; the app is self-contained and deterministic. -->
    <style>
      /* Static splash: visible instantly, replaced when React mounts. */
      #app-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #475569;
      }
      #app-splash .splash-spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid #d1fae5;
        border-top-color: #059669;
        animation: splash-spin 0.8s linear infinite;
      }
      #app-splash .splash-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #0f172a;
      }
      #app-splash .splash-sub {
        font-size: 12px;
        color: #94a3b8;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-spinner { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-busy="true">
        <div class="splash-spinner" aria-hidden="true"></div>
        <div class="splash-title">DMR Poultries</div>
        <div class="splash-sub">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

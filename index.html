<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="DMR Poultries — poultry logistics, operations, accounts, fleet and staff management."
    />
    <title>DMR Poultries</title>
    <style>
      html, body { background: #f8fafc; }
      #root { background: #f8fafc; min-height: 100vh; }

      /* ------------------------------------------------------------------
         Global accessibility scale
         ------------------------------------------------------------------
         The application has many intentionally dense ERP controls, including
         charts, tables, calendar vendors and existing pixel-based utilities.
         Scaling the application root keeps text, controls, icons and data
         visualisations in lock-step instead of letting text grow out of its
         existing boxes. The supported product range is 100%–150%; the normal
         13px body scale therefore tops out at 19.5px (~20px).

         The value is applied before React mounts so a saved preference never
         flashes at the default size. FontSizeProvider owns subsequent changes.
      */
      html {
        --ds-font-scale: 1;
        zoom: var(--ds-font-scale);
        width: calc(100% / var(--ds-font-scale));
        overflow-x: hidden;
      }

      /* Dark/light mode is intentionally disabled in the current UI.
         The existing ThemeProvider and theme implementation are retained for
         a future release; only the header/settings controls are hidden for now. */
      button[title="Switch to light mode"],
      button[title="Switch to dark mode"],
      button[title="లైట్ మోడ్‌కి మార్చండి"],
      button[title="డార్క్ మోడ్‌కి మార్చండి"] {
        display: none !important;
      }
    </style>
    <script>
      (() => {
        try {
          const allowed = [1, 1.1, 1.2, 1.3, 1.4, 1.5];
          const stored = Number.parseFloat(localStorage.getItem('dmr_font_scale') || '');
          const legacy = localStorage.getItem('dmr_font_size');
          const legacyScale = legacy === 'Large' ? 1.2 : 1;
          const value = Number.isFinite(stored) ? stored : legacyScale;
          const scale = allowed.reduce((best, step) =>
            Math.abs(step - value) < Math.abs(best - value) ? step : best,
            1,
          );
          document.documentElement.style.setProperty('--ds-font-scale', String(scale));
        } catch {
          /* Use the default scale when storage is unavailable. */
        }
      })();
    </script>
    <!-- Inter is bundled locally via @fontsource/inter (src/index.css) — no
         external font request; the app is self-contained and deterministic. -->
    <style>
      /* Static splash: visible instantly, replaced when React mounts. */
      #app-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #475569;
      }
      #app-splash .splash-spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid #d1fae5;
        border-top-color: #059669;
        animation: splash-spin 0.8s linear infinite;
      }
      #app-splash .splash-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #0f172a;
      }
      #app-splash .splash-sub {
        font-size: 12px;
        color: #94a3b8;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-spinner { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-busy="true">
        <div class="splash-spinner" aria-hidden="true"></div>
        <div class="splash-title">DMR Poultries</div>
        <div class="splash-sub">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="DMR Poultries — poultry logistics, operations, accounts, fleet and staff management."
    />
    <title>DMR Poultries</title>
    <!-- Apply persisted accessibility preferences before CSS/React can paint.
         Keep this dependency-free and in sync with src/providers/fontScale.ts. -->
    <script>
      (function () {
        var root = document.documentElement;
        var key = "dmr_font_scale";
        var legacyKey = "dmr_font_size";
        var levels = [1, 1.1, 1.2, 1.3, 1.4, 1.5];
        var scale = 1;
        var raw = null;
        try { raw = localStorage.getItem(key); } catch (_) { /* storage unavailable */ }

        if (raw === null) {
          var legacy = null;
          try { legacy = localStorage.getItem(legacyKey); } catch (_) { /* storage unavailable */ }
          if (typeof legacy === "string") {
            var old = legacy.trim().toLowerCase();
            scale = old === "large" ? 1.1 : 1;
            try {
              localStorage.setItem(key, String(scale));
              localStorage.removeItem(legacyKey);
            } catch (_) { /* read-only storage */ }
          }
        } else {
          var match = String(raw).trim().match(/^(\d+(?:\.\d+)?)\s*(%)?$/);
          if (match) {
            var numeric = Number(match[1]);
            if (match[2] || numeric >= 10) numeric = numeric / 100;
            if (isFinite(numeric)) {
              numeric = Math.min(1.5, Math.max(1, numeric));
              scale = levels.reduce(function (nearest, level) {
                return Math.abs(level - numeric) < Math.abs(nearest - numeric) ? level : nearest;
              }, 1);
            }
          }
          try {
            localStorage.setItem(key, String(scale));
            localStorage.removeItem(legacyKey);
          } catch (_) { /* read-only storage */ }
        }

        root.style.setProperty("--dmr-font-scale", String(scale));
        root.setAttribute("data-font-scale", String(Math.round(scale * 100)));

        /* Avoid a first-paint fallback face when Telugu was already selected. */
        try {
          if (localStorage.getItem("dmr-language") === "te") root.lang = "te";
        } catch (_) { /* language provider will use its safe default */ }
      })();
    </script>
    <style>
      html {
        font-size: calc(100% * var(--dmr-font-scale, 1));
        background: #064e3b;
      }
      body { background: #064e3b; }
      #root { background: #f8fafc; min-height: 100vh; }
    </style>
    <!-- Inter is bundled locally via @fontsource/inter (src/index.css) — no
         external font request; the app is self-contained and deterministic. -->
    <style>
      /* Static boot splash — visible on FIRST paint, identical to the
         AuthGate splash that replaces it, so loading is one continuous
         branded screen (never a white flash with a bare spinner). */
      #app-splash {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #065f46 0%, #064e3b 45%, #020617 100%);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #ffffff;
      }
      #app-splash .splash-hen {
        width: calc(112px * var(--dmr-font-scale, 1));
        height: calc(112px * var(--dmr-font-scale, 1));
        object-fit: contain;
        animation: splash-bob 1.9s ease-in-out infinite;
      }
      #app-splash .splash-title {
        margin-top: calc(24px * var(--dmr-font-scale, 1));
        font-size: calc(30px * var(--dmr-font-scale, 1));
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      #app-splash .splash-track {
        margin-top: calc(24px * var(--dmr-font-scale, 1));
        width: 176px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
      }
      #app-splash .splash-bar {
        width: 33%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(to right, #6ee7b7, #99f6e4);
        animation: splash-bar 1.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      #app-splash .splash-sub {
        margin-top: calc(16px * var(--dmr-font-scale, 1));
        font-size: calc(14px * var(--dmr-font-scale, 1));
        font-weight: 500;
        color: rgba(209, 250, 229, 0.8);
      }
      #app-splash .splash-dots span {
        display: inline-block;
        animation: splash-dot 1.4s ease-in-out infinite;
      }
      #app-splash .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      #app-splash .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-bob {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(-2.5deg); }
      }
      @keyframes splash-bar {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(340%); }
      }
      @keyframes splash-dot {
        0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-hen,
        #app-splash .splash-bar,
        #app-splash .splash-dots span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-busy="true">
        <img class="splash-hen" src="./dmr-hen.png" alt="" aria-hidden="true" />
        <div class="splash-title">DMR Poultries</div>
        <div class="splash-track" aria-hidden="true">
          <div class="splash-bar"></div>
        </div>
        <div class="splash-sub">
          Checking your session
          <span class="splash-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
